
<style>
*{box-sizing:border-box;margin:0;padding:0}
.app{display:flex;height:100vh;min-height:640px;background:#FFF5F9;overflow:hidden;border-radius:12px;font-family:system-ui,sans-serif}
.sidebar{width:204px;background:#FFE4F0;border-right:1px solid #FFB3D1;display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:18px 14px 14px;border-bottom:1px solid #FFB3D1}
.logo-title{font-size:13px;font-weight:700;color:#72243E;letter-spacing:-.01em}
.logo-sub{font-size:10px;color:#D4537E;margin-top:3px;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;font-size:13px;color:#993556;border-left:3px solid transparent;transition:all .12s}
.nav-item:hover{background:#FFD6E7;color:#72243E}
.nav-item.active{color:#72243E;border-left-color:#D4537E;background:#FFD6E7;font-weight:600}
.main{flex:1;overflow-y:auto;padding:20px;background:#FFF5F9}
.page{display:none}.page.active{display:block}
.page-title{font-size:17px;font-weight:600;color:#72243E;margin-bottom:18px}
.card{background:#fff;border:1px solid #FFD6E7;border-radius:14px;padding:14px 18px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:20px;border:1px solid #FFB3D1;background:#fff;cursor:pointer;font-size:12px;font-weight:500;color:#993556;transition:all .12s;white-space:nowrap}
.btn:hover{background:#FFE4F0;border-color:#FF80B3}
.btn-primary{background:#D4537E;color:#fff;border-color:#D4537E}
.btn-primary:hover{background:#993556;border-color:#993556}
.btn-sm{padding:4px 9px;font-size:11px}

input,select{width:100%;padding:7px 10px;border:1px solid #FFB3D1;border-radius:20px;background:#fff;color:#72243E;font-size:13px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#D4537E;box-shadow:0 0 0 3px #FFE4F0}
label{font-size:11px;color:#993556;display:block;margin-bottom:3px;margin-top:10px;font-weight:500}
label:first-child{margin-top:0}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
.stat-card{background:#fff;border:1px solid #FFD6E7;border-radius:14px;padding:12px;text-align:center}
.stat-label{font-size:11px;color:#993556}
.stat-value{font-size:24px;font-weight:600;color:#D4537E}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table th{text-align:left;padding:8px 12px;font-size:10px;font-weight:600;color:#993556;border-bottom:1px solid #FFD6E7;background:#FFF5F9;text-transform:uppercase;letter-spacing:.04em}
.table td{padding:8px 12px;border-bottom:1px solid #FFE4F0;color:#72243E;vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:#FFF5F9}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-ok{background:#FFE4F0;color:#72243E}
.badge-low{background:#FAEEDA;color:#854F0B}
.badge-zero{background:#FCEBEB;color:#A32D2D}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(114,36,62,.35);z-index:200;align-items:flex-start;justify-content:center;padding-top:30px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:20px;padding:22px;width:460px;max-width:93vw;border:1px solid #FFB3D1;max-height:82vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:600;margin-bottom:14px;color:#72243E}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:#FFD6E7;color:#72243E;flex-shrink:0;border:1px solid #FFB3D1}
.flex{display:flex;align-items:center;gap:8px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.empty{text-align:center;padding:28px;color:#D4537E;font-size:12px}
.toggle-row{display:flex;border:1px solid #FFB3D1;border-radius:20px;overflow:hidden;margin-bottom:12px;background:#FFF5F9}
.toggle-opt{flex:1;padding:7px;text-align:center;font-size:12px;font-weight:500;color:#993556;cursor:pointer;transition:all .12s}
.toggle-opt.active{background:#D4537E;color:#fff}
.serie-box{background:#FFF5F9;border:1px dashed #FFB3D1;border-radius:12px;padding:14px;margin-top:10px}
.day-checkboxes{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.day-cb{padding:4px 10px;border:1px solid #FFB3D1;border-radius:20px;cursor:pointer;font-size:12px;color:#993556;background:#fff;user-select:none}
.day-cb.checked{background:#D4537E;color:#fff;border-color:#D4537E}
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.week-nav-btn{padding:5px 12px;border-radius:20px;border:1px solid #FFB3D1;background:#fff;cursor:pointer;font-size:12px;color:#993556}
.week-nav-btn:hover{background:#FFE4F0}
.week-label{font-size:13px;font-weight:600;flex:1;text-align:center;color:#72243E}
.week-grid{display:grid;grid-template-columns:46px repeat(7,1fr);border:1px solid #FFD6E7;border-radius:12px;overflow:hidden;min-width:520px}
.wg-header{background:#FFE4F0;border-bottom:1px solid #FFD6E7;padding:7px 3px;text-align:center;font-size:11px;font-weight:600;color:#72243E;position:sticky;top:0;z-index:2}
.wg-hour-label{background:#FFF5F9;border-right:1px solid #FFE4F0;border-bottom:1px solid #FFE4F0;padding:0 4px;display:flex;align-items:flex-start;justify-content:flex-end;font-size:10px;color:#D4537E;font-weight:500;padding-top:3px;height:48px}
.wg-cell{border-right:1px solid #FFE4F0;border-bottom:1px solid #FFE4F0;height:48px;padding:2px}
.wg-cell:last-child{border-right:none}
.today-col{background:#FFF0F5}
.wg-lesson{border-radius:5px;padding:2px 5px;font-size:10px;font-weight:600;height:100%;display:flex;flex-direction:column;justify-content:center;cursor:pointer;overflow:hidden;border-left:3px solid transparent}
.wg-lesson.scheduled{background:#FFE4F0;border-left-color:#D4537E;color:#72243E}.wg-lesson.scheduled:hover{background:#FFD6E7}
.wg-lesson.done{background:#EAF3DE;border-left-color:#3B6D11;color:#27500A}.wg-lesson.done:hover{background:#C0DD97}
.wg-lesson.missed{background:#FFF9E6;border-left-color:#BA7517;color:#633806}.wg-lesson.missed:hover{background:#FAC775}
.wg-lesson.missed_charged{background:#FCEBEB;border-left-color:#A32D2D;color:#791F1F}.wg-lesson.missed_charged:hover{background:#F7C1C1}
.status-option{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:12px;border:1px solid #FFD6E7;cursor:pointer;transition:all .12s;margin-bottom:10px}
.status-option:hover{border-color:#FFB3D1;background:#FFF5F9}
.so-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;margin-top:1px}
.so-title{font-size:13px;font-weight:600}
.so-desc{font-size:11px;color:#993556;margin-top:2px}
.client-modal{background:#fff;border-radius:20px;padding:22px;width:540px;max-width:95vw;border:1px solid #FFB3D1;max-height:88vh;overflow-y:auto}
.rank-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #FFE4F0}
.rank-row:last-child{border-bottom:none}
.rank-bar-wrap{flex:1;height:8px;background:#FFE4F0;border-radius:4px;overflow:hidden;display:flex}
.donut-legend{display:flex;flex-direction:column;gap:6px;width:100%}
.donut-leg-row{display:flex;align-items:center;gap:7px;font-size:11px;color:#72243E}
.donut-leg-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
/* PORTAL */
.portal{min-height:100vh;background:#FFF0F5;font-family:system-ui,sans-serif}
.portal-topbar{background:#fff;border-bottom:1px solid #FFD6E7;padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between}
.portal-brand{display:flex;align-items:center;gap:10px}
.portal-brand-initials{width:34px;height:34px;border-radius:50%;background:#FFE4F0;border:1px solid #FFB3D1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#72243E}
.portal-brand-name{font-size:14px;font-weight:700;color:#72243E;letter-spacing:-.01em}
.portal-brand-tagline{font-size:10px;color:#D4537E;margin-top:1px}
.portal-hero{background:linear-gradient(135deg,#FFE4F0 0%,#FFD6E7 50%,#FFBDD8 100%);padding:36px 28px 32px;border-bottom:1px solid #FFB3D1}
.portal-hero-greeting{font-size:11px;font-weight:600;color:#D4537E;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.portal-hero-name{font-size:30px;font-weight:700;color:#72243E;letter-spacing:-.02em;line-height:1.1;margin-bottom:4px}
.portal-hero-sub{font-size:13px;color:#993556;font-style:italic}
.portal-credits-row{display:flex;align-items:stretch;gap:12px;margin-top:22px}
.portal-credit-box{background:#fff;border-radius:16px;border:1px solid #FFD6E7;padding:16px 20px;flex:1}
.portal-credit-num{font-size:40px;font-weight:700;color:#D4537E;line-height:1}
.portal-credit-label{font-size:11px;color:#993556;margin-top:4px}
.portal-credit-note{font-size:10px;color:#FFB3D1;margin-top:2px}
.portal-credit-bar{height:5px;background:#FFE4F0;border-radius:3px;margin-top:12px;overflow:hidden}
.portal-credit-fill{height:100%;background:linear-gradient(90deg,#D4537E,#FF80B3);border-radius:3px}
.portal-stat-mini{background:#fff;border-radius:16px;border:1px solid #FFD6E7;padding:14px;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.portal-stat-mini-num{font-size:26px;font-weight:700;line-height:1}
.portal-stat-mini-label{font-size:10px;color:#993556;margin-top:4px}
.portal-body{padding:24px 28px;max-width:700px}
.portal-section-title{font-size:10px;font-weight:700;color:#D4537E;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.portal-lesson-card{background:#fff;border:1px solid #FFD6E7;border-radius:16px;overflow:hidden;margin-bottom:16px}
.portal-lesson-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #FFE4F0}
.portal-lesson-row:last-child{border-bottom:none}
.portal-lesson-date{font-size:15px;font-weight:600;color:#72243E}
.portal-lesson-time{font-size:12px;color:#D4537E;margin-top:2px}
.portal-join-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;background:#D4537E;color:#fff;border-radius:20px;text-decoration:none;font-size:12px;font-weight:600;transition:background .15s}
.portal-join-btn:hover{background:#993556}
.portal-hist-row{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid #FFE4F0}
.portal-hist-row:last-child{border-bottom:none}
.portal-status-pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.portal-empty{padding:28px;text-align:center;color:#D4537E;font-size:13px;background:#fff;border:1px solid #FFD6E7;border-radius:16px;font-style:italic}
.portal-footer{padding:24px 28px;text-align:center;font-size:11px;color:#D4537E;border-top:1px solid #FFD6E7;background:#fff;margin-top:8px}
.portal-stats-grid{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:#fff;border:1px solid #FFD6E7;border-radius:16px;padding:20px 24px;margin-bottom:16px}
.portal-stat-bars{display:flex;flex-direction:column;gap:10px;width:100%}
.portal-stat-bar-row{display:flex;flex-direction:column;gap:4px}
.portal-stat-bar-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:500}
.portal-stat-bar-track{height:8px;background:#FFE4F0;border-radius:4px;overflow:hidden}
.portal-stat-bar-fill{height:100%;border-radius:4px}
</style>

<div id="root"></div>

<script>
let clients=[],lessons=[];
let calWeekOffset=0,activeCreditsClient=null,lessonModalMode='single',selectedDays=[];
let pendingStatusLesson=null,viewingClient=null;
try{clients=JSON.parse(localStorage.getItem('eng_cl_v4')||'[]');}catch(e){}
try{lessons=JSON.parse(localStorage.getItem('eng_ls_v4')||'[]');}catch(e){}
function save(){try{localStorage.setItem('eng_cl_v4',JSON.stringify(clients));localStorage.setItem('eng_ls_v4',JSON.stringify(lessons));}catch(e){}}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function today(){return new Date().toISOString().slice(0,10)}
function formatDate(d){if(!d)return'';const[y,m,day]=d.split('-');return day+'/'+m+'/'+y}
function fmtLong(d){if(!d)return'';return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}
function creditBadge(n){if(n>3)return'badge-ok';if(n>0)return'badge-low';return'badge-zero';}
const HRT='&#10084;';
const STATUS={
  scheduled:{label:'Scheduled',color:'#D4537E',bg:'#FFE4F0'},
  done:{label:'Completed',color:'#3B6D11',bg:'#EAF3DE'},
  missed:{label:'Not done',color:'#BA7517',bg:'#FFF9E6'},
  missed_charged:{label:'Student absent',color:'#A32D2D',bg:'#FCEBEB'}
};
const sStyles={done:{bg:'#EAF3DE',color:'#3B6D11',label:'Completed'},missed:{bg:'#FFF9E6',color:'#BA7517',label:'Not done'},missed_charged:{bg:'#FCEBEB',color:'#A32D2D',label:'Absent'},scheduled:{bg:'#FFE4F0',color:'#D4537E',label:'Scheduled'}};

/* 6:00 → 23:00 */
const HOURS=Array.from({length:18},(_,i)=>i+6);

function makeDonut(done,missed,mc,size){
  size=size||96;
  const total=done+missed+mc,cx=size/2,cy=size/2,r=size/2-8,sw=12,circ=2*Math.PI*r;
  if(!total)return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#FFE4F0" stroke-width="${sw}"/><text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="11" fill="#D4537E" font-family="system-ui">—</text></svg>`;
  const segs=[{v:done,c:'#3B6D11'},{v:missed,c:'#BA7517'},{v:mc,c:'#A32D2D'}];
  let off=0,paths='';
  segs.forEach(s=>{if(!s.v)return;const p=s.v/total,dash=p*circ;paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${sw}" stroke-dasharray="${dash.toFixed(2)} ${(circ-dash).toFixed(2)}" stroke-dashoffset="${(-off*circ).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;off+=p;});
  const pct=Math.round(done/total*100);
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#FFE4F0" stroke-width="${sw}"/>${paths}<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="${size>80?13:10}" font-weight="700" fill="#72243E" font-family="system-ui">${pct}%</text><text x="${cx}" y="${cy+9}" text-anchor="middle" font-size="9" fill="#993556" font-family="system-ui">done</text></svg>`;
}

function clientScore(cid){
  const cl=lessons.filter(l=>l.clientId===cid&&l.status!=='scheduled');
  const done=cl.filter(l=>l.status==='done').length,mc=cl.filter(l=>l.status==='missed_charged').length,m=cl.filter(l=>l.status==='missed').length;
  return{done,mc,m,tot:done+mc+m,score:done+mc+m===0?-1:mc*2+m-done};
}

const PARAMS=new URLSearchParams(window.location.search);
if(PARAMS.get('student'))renderPortal(PARAMS.get('student'));
else renderApp();

function renderPortal(sid){
  const c=clients.find(x=>x.id===sid),R=document.getElementById('root');
  if(!c){R.innerHTML=`<div style="min-height:100vh;background:#FFF0F5;display:flex;align-items:center;justify-content:center;font-family:system-ui"><div style="text-align:center;padding:40px"><div style="font-size:48px;margin-bottom:16px">&#127800;</div><div style="font-size:18px;font-weight:600;color:#72243E">Page not found</div><div style="font-size:13px;color:#D4537E;margin-top:8px;font-style:italic">Please ask your teacher for an updated link.</div></div></div>`;return;}
  const now=today();
  const upcoming=lessons.filter(l=>l.clientId===sid&&l.date>=now&&l.status==='scheduled').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const history=lessons.filter(l=>l.clientId===sid&&(l.date<now||l.status!=='scheduled')).sort((a,b)=>b.date.localeCompare(a.date));
  const sc=clientScore(sid);
  const maxC=Math.max(c.credits+sc.done+sc.mc,1);
  const fillPct=Math.min(100,Math.round(c.credits/maxC*100));
  const pDone=sc.tot?Math.round(sc.done/sc.tot*100):0;
  const pMissed=sc.tot?Math.round(sc.m/sc.tot*100):0;
  const pMC=sc.tot?Math.round(sc.mc/sc.tot*100):0;
  const donut=makeDonut(sc.done,sc.m,sc.mc,110);
  R.innerHTML=`<div class="portal">
    <div class="portal-topbar">
      <div class="portal-brand"><div class="portal-brand-initials">OK</div><div><div class="portal-brand-name">Olha Kulinich</div><div class="portal-brand-tagline">English Lessons</div></div></div>
      <div style="font-size:11px;color:#D4537E">${new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'})}</div>
    </div>
    <div class="portal-hero">
      <div class="portal-hero-greeting">Your lesson space</div>
      <div class="portal-hero-name">${c.name}</div>
      <div class="portal-hero-sub">${c.email||'English with Olha'}</div>
      <div class="portal-credits-row">
        <div class="portal-credit-box"><div class="portal-credit-num">${c.credits}</div><div class="portal-credit-label">Credits available</div><div class="portal-credit-note">1 credit = 1 lesson</div><div class="portal-credit-bar"><div class="portal-credit-fill" style="width:${fillPct}%"></div></div></div>
        <div class="portal-stat-mini"><div class="portal-stat-mini-num" style="color:#3B6D11">${sc.done}</div><div class="portal-stat-mini-label">Completed<br>lessons</div></div>
        <div class="portal-stat-mini"><div class="portal-stat-mini-num" style="color:#D4537E">${upcoming.length}</div><div class="portal-stat-mini-label">Upcoming<br>lessons</div></div>
      </div>
    </div>
    <div class="portal-body">
      ${sc.tot>0?`<div class="portal-section-title">Your lesson breakdown</div>
      <div class="portal-stats-grid">
        <div>${donut}</div>
        <div class="portal-stat-bars">
          <div class="portal-stat-bar-row"><div class="portal-stat-bar-label"><span style="color:#3B6D11;font-weight:600">Completed</span><span style="color:#3B6D11;font-size:13px;font-weight:700">${pDone}% &mdash; ${sc.done} lesson${sc.done!==1?'s':''}</span></div><div class="portal-stat-bar-track"><div class="portal-stat-bar-fill" style="width:${pDone}%;background:#3B6D11"></div></div></div>
          <div class="portal-stat-bar-row"><div class="portal-stat-bar-label"><span style="color:#BA7517;font-weight:600">Not done</span><span style="color:#BA7517;font-size:13px;font-weight:700">${pMissed}% &mdash; ${sc.m} lesson${sc.m!==1?'s':''}</span></div><div class="portal-stat-bar-track"><div class="portal-stat-bar-fill" style="width:${pMissed}%;background:#BA7517"></div></div></div>
          <div class="portal-stat-bar-row"><div class="portal-stat-bar-label"><span style="color:#A32D2D;font-weight:600">Absent</span><span style="color:#A32D2D;font-size:13px;font-weight:700">${pMC}% &mdash; ${sc.mc} lesson${sc.mc!==1?'s':''}</span></div><div class="portal-stat-bar-track"><div class="portal-stat-bar-fill" style="width:${pMC}%;background:#A32D2D"></div></div></div>
          <div style="margin-top:8px;padding-top:8px;border-top:1px solid #FFE4F0;font-size:11px;color:#993556">${sc.tot} lesson${sc.tot!==1?'s':''} total recorded</div>
        </div>
      </div>`:''}
      <div class="portal-section-title">Upcoming lessons</div>
      ${upcoming.length?`<div class="portal-lesson-card">${upcoming.map(l=>`<div class="portal-lesson-row"><div><div class="portal-lesson-date">${fmtLong(l.date)}</div><div class="portal-lesson-time">at ${l.time}</div></div>${c.meet?`<a href="${c.meet}" class="portal-join-btn">Join lesson &rarr;</a>`:''}</div>`).join('')}</div>`:`<div class="portal-empty">No lessons scheduled yet &mdash; your teacher will update this soon.</div>`}
      ${history.length?`<div class="portal-section-title" style="margin-top:8px">Lesson history</div><div class="portal-lesson-card">${history.map(l=>{const s=sStyles[l.status]||sStyles.scheduled;return`<div class="portal-hist-row"><div><div style="font-size:13px;font-weight:600;color:#72243E">${fmtLong(l.date)}</div><div style="font-size:11px;color:#D4537E">at ${l.time}</div></div><span class="portal-status-pill" style="background:${s.bg};color:${s.color}">${s.label}</span></div>`;}).join('')}</div>`:''}
    </div>

function navTo(el,page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  el.classList.add('active');
  if(page==='dashboard')renderDashboard();
  if(page==='clienti')renderClients();
  if(page==='calendario')renderWeek();
  if(page==='lezioni')renderLessons();
}
function openModal(id){
  if(id==='modal-add-lesson'){populateLessonSelect();switchMode('single');selectedDays=[];document.querySelectorAll('.day-cb').forEach(d=>d.classList.remove('checked'));document.getElementById('time-slots').innerHTML='';document.getElementById('serie-preview').textContent='';}
  document.getElementById(id).classList.add('open');
}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function switchMode(m){
  lessonModalMode=m;
  document.getElementById('toggle-single').classList.toggle('active',m==='single');
  document.getElementById('toggle-serie').classList.toggle('active',m==='serie');
  document.getElementById('mode-single').style.display=m==='single'?'':'none';
  document.getElementById('mode-serie').style.display=m==='serie'?'':'none';
}
function toggleDay(el){
  const d=parseInt(el.dataset.day);
  if(selectedDays.includes(d)){selectedDays=selectedDays.filter(x=>x!==d);el.classList.remove('checked');}
  else{selectedDays.push(d);el.classList.add('checked');}
  renderTimeSlots();updateSeriePreview();
}
const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function renderTimeSlots(){
  const box=document.getElementById('time-slots');
  const sorted=[...selectedDays].sort((a,b)=>a===0?7-b:b===0?a-7:a-b);
  box.innerHTML=sorted.map(d=>`<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span style="font-size:12px;color:#72243E;font-weight:500;min-width:36px">${dayNames[d]}</span><input type="time" id="time-day-${d}" value="10:00" style="width:110px"></div>`).join('');
  box.querySelectorAll('input').forEach(i=>i.addEventListener('change',updateSeriePreview));
}
function updateSeriePreview(){
  const w=parseInt(document.getElementById('s-weeks')?.value)||0,t=selectedDays.length*w;
  document.getElementById('serie-preview').textContent=t>0?`${t} lessons will be scheduled (${selectedDays.length} days x ${w} weeks)`:'';
}
function populateLessonSelect(){
  const sel=document.getElementById('l-cliente');
  sel.innerHTML='<option value="">Select student...</option>';
  clients.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;sel.appendChild(o);});
}
function addClient(){
  const name=document.getElementById('c-nome').value.trim(),email=document.getElementById('c-email').value.trim(),meet=document.getElementById('c-meet').value.trim(),cred=parseInt(document.getElementById('c-crediti').value)||0;
  if(!name)return alert('Please enter a name!');
  clients.push({id:genId(),name,email,meet,credits:cred});
  save();closeModal('modal-add-client');
  ['c-nome','c-email','c-meet'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('c-crediti').value='0';
  renderClients();renderDashboard();
}
function deleteClient(id){
  if(!confirm('Delete this student?'))return;
  clients=clients.filter(c=>c.id!==id);lessons=lessons.filter(l=>l.clientId!==id);
  save();renderClients();renderDashboard();
}
function addLesson(){
  const cid=document.getElementById('l-cliente').value;
  if(!cid)return alert('Please select a student!');
  if(lessonModalMode==='single'){
    const date=document.getElementById('l-data').value,time=document.getElementById('l-ora').value;
    if(!date||!time)return alert('Please fill in date and time!');
    lessons.push({id:genId(),clientId:cid,date,time,status:'scheduled'});
  } else {
    const startStr=document.getElementById('s-start').value,weeks=parseInt(document.getElementById('s-weeks').value)||0;
    if(!startStr)return alert('Please enter a start date!');
    if(!selectedDays.length)return alert('Please select at least one day!');
    if(weeks<1)return alert('Please enter the number of weeks!');
    const dayTimes={};let ok=true;
    selectedDays.forEach(d=>{const inp=document.getElementById('time-day-'+d);if(!inp||!inp.value)ok=false;else dayTimes[d]=inp.value;});
    if(!ok)return alert('Please enter a time for each day!');
    const start=new Date(startStr+'T12:00:00');
    for(let w=0;w<weeks;w++){selectedDays.forEach(day=>{const dt=new Date(start);dt.setDate(dt.getDate()+w*7+(day-dt.getDay()+7)%7);lessons.push({id:genId(),clientId:cid,date:dt.toISOString().slice(0,10),time:dayTimes[day],status:'scheduled'});});}
  }
  lessons.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  save();closeModal('modal-add-lesson');
  renderDashboard();renderWeek();renderLessons();renderClients();
}
function openStatusModal(lid){
  pendingStatusLesson=lid;
  const l=lessons.find(x=>x.id===lid),c=clients.find(x=>x.id===l?.clientId),s=STATUS[l?.status]||STATUS.scheduled;
  document.getElementById('modal-status-title').innerHTML=`${HRT} ${c?.name||''} &mdash; ${formatDate(l?.date)} at ${l?.time} <span style="padding:2px 8px;border-radius:20px;font-size:10px;background:${s.bg};color:${s.color};margin-left:6px">${s.label}</span>`;

function setStatus(ns){
  const l=lessons.find(x=>x.id===pendingStatusLesson);if(!l)return;
  const c=clients.find(x=>x.id===l.clientId);if(!c)return;
  const wasCharged=l.status==='done'||l.status==='missed_charged',willCharge=ns==='done'||ns==='missed_charged';
  if(wasCharged&&!willCharge)c.credits+=1;
  if(!wasCharged&&willCharge){if(c.credits<=0)return alert('No credits available!');c.credits-=1;}
  l.status=ns;save();closeModal('modal-status');
  renderDashboard();renderWeek();renderLessons();renderClients();
  if(viewingClient)openClientDetail(viewingClient);
}
function confirmDeleteLesson(){
  if(!confirm('Delete this lesson?'))return;
  const l=lessons.find(x=>x.id===pendingStatusLesson);
  if(l){const c=clients.find(x=>x.id===l.clientId);if(c&&(l.status==='done'||l.status==='missed_charged'))c.credits+=1;lessons=lessons.filter(x=>x.id!==pendingStatusLesson);}
  save();closeModal('modal-status');renderDashboard();renderWeek();renderLessons();renderClients();
}

        <div class="donut-legend">
          <div class="donut-leg-row"><div class="donut-leg-dot" style="background:#3B6D11"></div><span>Completed &mdash; <strong>${totDone}</strong></span></div>
          <div class="donut-leg-row"><div class="donut-leg-dot" style="background:#BA7517"></div><span>Not done &mdash; <strong>${totMissed}</strong></span></div>
          <div class="donut-leg-row"><div class="donut-leg-dot" style="background:#A32D2D"></div><span>Absences &mdash; <strong>${totMC}</strong></span></div>
          ${totDone+totMissed+totMC===0?`<div style="font-size:11px;color:#D4537E">No lessons recorded yet</div>`:''}
        </div>
      </div>
    </div>
    <div class="card" style="margin:0">
      <div style="font-size:13px;font-weight:600;color:#72243E;margin-bottom:10px">${HRT} Student ranking</div>
      ${ranked.length===0?`<div style="font-size:12px;color:#D4537E;padding:8px 0">No data yet &mdash; update some lesson statuses first!</div>`:ranked.map((x,i)=>{
        const{sc,c}=x,tot=sc.tot||1,pD=Math.round(sc.done/tot*100),pM=Math.round(sc.m/tot*100),pMC=Math.round(sc.mc/tot*100);
        const medal=i===0?'&#129315;':i===ranked.length-1&&ranked.length>1?'&#129321;':'';
        return`<div class="rank-row"><div style="font-size:13px;font-weight:700;color:#FFB3D1;min-width:20px;text-align:center">${i+1}</div>
          <div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12px;font-weight:600;color:#72243E;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${medal} ${c.name.split(' ')[0]}</span><span style="font-size:10px;color:#993556;flex-shrink:0;margin-left:6px">${pD}% done</span></div>
          <div class="rank-bar-wrap"><div style="width:${pD}%;background:#3B6D11;height:100%;border-radius:4px 0 0 4px"></div><div style="width:${pM}%;background:#BA7517;height:100%"></div><div style="width:${pMC}%;background:#A32D2D;height:100%;border-radius:0 4px 4px 0"></div></div></div>
          <button class="btn btn-sm" style="margin-left:8px;flex-shrink:0" onclick="openClientDetail('${c.id}')">View</button></div>`;}).join('')}
      ${ranked.length>0?`<div style="display:flex;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid #FFE4F0">
        <div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#3B6D11"><div style="width:8px;height:8px;background:#3B6D11;border-radius:1px"></div>Completed</div>
        <div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#BA7517"><div style="width:8px;height:8px;background:#BA7517;border-radius:1px"></div>Not done</div>
        <div style="display:flex;align-items:center;gap:4px;font-size:10px;color:#A32D2D"><div style="width:8px;height:8px;background:#A32D2D;border-radius:1px"></div>Absences</div>
      </div>`:''}
    </div>
  </div>
  <div class="card">
    <div class="section-header"><span style="font-size:13px;font-weight:600;color:#72243E">${HRT} Upcoming lessons</span><button class="btn btn-primary btn-sm" onclick="openModal('modal-add-lesson')">+ New</button></div>
    ${upcoming.length?upcoming.map(l=>{const c=clients.find(x=>x.id===l.clientId);return`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #FFE4F0"><div class="flex"><div class="avatar">${(c?.name||'?').slice(0,2).toUpperCase()}</div><div><div style="font-size:12px;font-weight:600;color:#72243E">${c?.name||'?'}</div><div style="font-size:11px;color:#D4537E">${formatDate(l.date)} &middot; ${l.time}</div></div></div><button class="btn btn-sm" onclick="openStatusModal('${l.id}')">Update</button></div>`;}).join(''):`<div class="empty">No lessons scheduled</div>`}
  </div>
  ${low.length?`<div class="card"><div class="section-header"><span style="font-size:13px;font-weight:600;color:#72243E">${HRT} Low credits</span></div>${low.map(c=>{const b=creditBadge(c.credits);return`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #FFE4F0"><span style="font-size:12px;font-weight:600;color:#72243E">${c.name}</span><div style="display:flex;align-items:center;gap:8px"><span class="badge ${b}">${c.credits} cr</span><button class="btn btn-sm btn-primary" onclick="openCredits('${c.id}')">Top up</button></div></div>`;}).join('')}</div>`:''}`;
}
function renderClients(){
  const el=document.getElementById('page-clienti');if(!el)return;
  el.innerHTML=`<div class="section-header"><div class="page-title" style="margin:0">${HRT} Students</div><button class="btn btn-primary" onclick="openModal('modal-add-client')">${HRT} Add student</button></div>
  <div class="card" style="padding:0;overflow:hidden">
  <table class="table"><thead><tr><th>Name</th><th>Credits</th><th>Completed</th><th>Scheduled</th><th>Chart</th><th>Actions</th></tr></thead>
  <tbody>${clients.length?clients.map(c=>{const b=creditBadge(c.credits);const sc=clientScore(c.id);const mini=makeDonut(sc.done,sc.m,sc.mc,44);
    return`<tr><td><div class="flex"><div class="avatar">${c.name.slice(0,2).toUpperCase()}</div><span style="font-weight:600;color:#72243E;cursor:pointer;text-decoration:underline dotted" onclick="openClientDetail('${c.id}')">${c.name}</span></div></td>
    <td><span class="badge ${b}">${c.credits}</span></td>
    <td><span style="font-size:12px;color:#3B6D11;font-weight:600">&#10003; ${sc.done}</span></td>
    <td><span style="font-size:12px;color:#D4537E;font-weight:600">${HRT} ${lessons.filter(l=>l.clientId===c.id&&l.status==='scheduled').length}</span></td>
    <td><div style="cursor:pointer" onclick="openClientDetail('${c.id}')">${mini}</div></td>
    <td><div style="display:flex;gap:4px"><button class="btn btn-sm" onclick="openClientDetail('${c.id}')">View</button><button class="btn btn-sm" onclick="openCredits('${c.id}')">+ Credits</button><button class="btn btn-sm" onclick="showLink('${c.id}')">${HRT} Link</button><button class="btn btn-sm btn-danger" onclick="deleteClient('${c.id}')">&#10005;</button></div></td>
    </tr>`;}).join(''):`<tr><td colspan="6" class="empty">${HRT} No students yet</td></tr>`}</tbody></table></div>`;
}
function getWeekDates(o){const now=new Date();const md=now.getDay()===0?-6:1-now.getDay();const mon=new Date(now);mon.setDate(now.getDate()+md+o*7);return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d.toISOString().slice(0,10);});}
function renderWeek(){
  const el=document.getElementById('page-calendario');if(!el)return;
  const dates=getWeekDates(calWeekOffset),todayStr=today();
  const DL=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const s=new Date(dates[0]+'T12:00:00'),e=new Date(dates[6]+'T12:00:00');
  const wl=`${s.getDate()} ${M[s.getMonth()]} &mdash; ${e.getDate()} ${M[e.getMonth()]} ${e.getFullYear()}`;
  let hdr=`<div class="wg-header"></div>`;
  dates.forEach((d,i)=>{const dt=new Date(d+'T12:00:00');const isT=d===todayStr;hdr+=`<div class="wg-header${isT?' today-col':''}" style="${isT?'color:#D4537E':''}"><div>${DL[i]}</div><div style="font-size:10px">${dt.getDate()}/${dt.getMonth()+1}</div></div>`;});
  let body='';
  HOURS.forEach(h=>{
    body+=`<div class="wg-hour-label">${String(h).padStart(2,'0')}:00</div>`;
    dates.forEach(d=>{const isT=d===todayStr;const cell=lessons.filter(l=>l.date===d&&parseInt(l.time.split(':')[0])===h);const inner=cell.map(l=>{const c=clients.find(x=>x.id===l.clientId);const s=STATUS[l.status]||STATUS.scheduled;return`<div class="wg-lesson ${l.status||'scheduled'}" onclick="openStatusModal('${l.id}')" title="${c?.name||''} \u2014 ${s.label}"><div style="font-size:10px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c?.name.split(' ')[0]||'?'}</div><div style="font-size:9px;opacity:.8">${l.time}</div></div>`;}).join('');body+=`<div class="wg-cell${isT?' today-col':''}">${inner}</div>`;});
  });
  el.innerHTML=`<div class="section-header"><div class="page-title" style="margin:0">${HRT} Calendar</div><button class="btn btn-primary btn-sm" onclick="openModal('modal-add-lesson')">${HRT} New lesson</button></div>
  <div class="week-nav"><button class="week-nav-btn" onclick="calWeekOffset--;renderWeek()">&larr; Prev</button><span class="week-label">${HRT} ${wl}</span><button class="week-nav-btn" onclick="calWeekOffset++;renderWeek()">Next &rarr;</button><button class="week-nav-btn" onclick="calWeekOffset=0;renderWeek()">Today</button></div>
  <div style="display:flex;gap:12px;margin-bottom:10px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#72243E"><div style="width:10px;height:10px;border-radius:2px;background:#FFE4F0;border-left:3px solid #D4537E"></div> Scheduled</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#27500A"><div style="width:10px;height:10px;border-radius:2px;background:#EAF3DE;border-left:3px solid #3B6D11"></div> Completed</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#633806"><div style="width:10px;height:10px;border-radius:2px;background:#FFF9E6;border-left:3px solid #BA7517"></div> Not done</div>
    <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:#791F1F"><div style="width:10px;height:10px;border-radius:2px;background:#FCEBEB;border-left:3px solid #A32D2D"></div> Absent</div>
  </div>
  <div class="card" style="padding:8px;overflow-x:auto">
    <div class="week-grid" style="min-width:520px">${hdr}${body}</div>
    <div style="font-size:10px;color:#D4537E;margin-top:8px;text-align:center">${HRT} Click on a lesson to update its status</div>
  </div>`;
}
function renderLessons(){
  const el=document.getElementById('page-lezioni');if(!el)return;
  el.innerHTML=`<div class="section-header"><div class="page-title" style="margin:0">${HRT} All lessons</div><button class="btn btn-primary btn-sm" onclick="openModal('modal-add-lesson')">${HRT} New lesson</button></div>
  <div class="card" style="padding:0;overflow:hidden">
  <table class="table"><thead><tr><th>Date</th><th>Time</th><th>Student</th><th>Status</th><th></th></tr></thead>
  <tbody>${lessons.length?lessons.map(l=>{const c=clients.find(x=>x.id===l.clientId);const s=STATUS[l.status]||STATUS.scheduled;return`<tr><td style="color:#72243E;font-weight:500">${formatDate(l.date)}</td><td style="color:#D4537E;font-weight:500">${l.time}</td><td><div class="flex"><div class="avatar">${(c?.name||'?').slice(0,2).toUpperCase()}</div>${c?.name||'?'}</div></td><td><span style="padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;background:${s.bg};color:${s.color}">${s.label}</span></td><td><button class="btn btn-sm" onclick="openStatusModal('${l.id}')">Update</button></td></tr>`;}).join(''):`<tr><td colspan="5" class="empty">${HRT} No lessons yet</td></tr>`}</tbody></table></div>`;
}
</script>
